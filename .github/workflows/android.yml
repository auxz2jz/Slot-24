name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: site-route-planner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Publish version 0.5 debug APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk#SiteRoutePlanner-v0.5.apk"
          if gh release view v0.5.0 >/dev/null 2>&1; then
            gh release upload v0.5.0 "$APK" --clobber
          else
            gh release create v0.5.0 "$APK" --target "$GITHUB_SHA" \
              --title "Site Route Planner v0.5" \
              --notes "Debug APK for personal testing. Moves saved sites into vertical list below the map, supports selecting a single site for current GPS-to-site routing, separate full ordered checkpoint route, Up/Down reordering. Backup/restore and map rendering fixes remain. Android 8+. APK debug signing may differ from previous builds; do not uninstall an older app containing important stops without a backup."
          fi
